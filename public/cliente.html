<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encontre suas fotos — Foto Facial Match</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header><a href="/">Foto Facial Match</a></header>
<main>
  <div class="card">
    <h1>Envie uma selfie para encontrar suas fotos</h1>
    <form id="selfieForm">
      <label for="selfie">Selfie (JPEG, PNG ou WEBP)</label>
      <input id="selfie" type="file" accept="image/jpeg,image/png,image/webp" capture="user" required>
      <button type="submit" id="searchBtn">Buscar minhas fotos</button>
    </form>
    <p id="searchMsg" class="msg"></p>
    <button type="button" id="showCpfSearchBtn" class="link">Já comprei antes? Ver minhas compras</button>
  </div>

  <div class="card hidden" id="cpfCard">
    <h2>Buscar minhas compras</h2>
    <label for="cpfSearchInput">CPF</label>
    <input id="cpfSearchInput" type="text" inputmode="numeric" placeholder="000.000.000-00" maxlength="14">
    <button type="button" id="cpfSearchBtn">Buscar</button>
    <p id="cpfSearchMsg" class="msg"></p>
    <div id="cpfResults"></div>
  </div>

  <div class="card hidden" id="resultsCard">
    <h2>Encontramos isso:</h2>
    <p class="msg">Adicione ao carrinho as fotos/vídeos que quiser comprar.</p>
    <div id="results" class="grid"></div>
  </div>

  <div class="card hidden" id="checkoutCard">
    <h2>Finalizar compra</h2>
    <div id="checkoutBody"></div>
  </div>
</main>

<dialog id="lightbox" class="lightbox">
  <button type="button" class="lightbox-close" aria-label="Fechar">✕</button>
  <img id="lightboxImg" src="" alt="">
</dialog>

<div id="cartBar" class="cart-bar hidden">
  <span id="cartSummary"></span>
  <button type="button" id="cartBuyBtn">Comprar selecionadas</button>
</div>

<script src="/api.js"></script>
<script>
const selfieForm = document.getElementById('selfieForm');
const searchMsg = document.getElementById('searchMsg');
const searchBtn = document.getElementById('searchBtn');
const resultsCard = document.getElementById('resultsCard');
const resultsEl = document.getElementById('results');
const checkoutCard = document.getElementById('checkoutCard');
const checkoutBody = document.getElementById('checkoutBody');
const cartBar = document.getElementById('cartBar');
const cartSummary = document.getElementById('cartSummary');
const cartBuyBtn = document.getElementById('cartBuyBtn');

function showMsg(el, text, isError) {
  el.textContent = text;
  el.className = 'msg ' + (isError ? 'error' : 'ok');
}

function formatCents(cents) {
  return (cents / 100).toFixed(2).replace('.', ',');
}

// Máscara simples de CPF (000.000.000-00) enquanto digita, sem lib.
// Mesma função de public/entrada.html — duplicada de propósito (páginas
// standalone, sem módulo compartilhado, mesmo padrão de escapeAttr/initials).
function formatCpf(value) {
  const digits = value.replace(/\D/g, '').slice(0, 11);
  return digits
    .replace(/(\d{3})(\d)/, '$1.$2')
    .replace(/(\d{3})(\d)/, '$1.$2')
    .replace(/(\d{3})(\d{1,2})$/, '$1-$2');
}

// Seleção do cliente vive só no estado da página (sem carrinho persistente
// no backend, sem sessão): um Map media_id -> dados da mídia, preenchido a
// partir dos resultados da própria busca por selfie e descartado ao sair da
// página ou fazer nova busca.
const selectedMedia = new Map();

function updateCartBar() {
  const count = selectedMedia.size;
  if (count === 0) {
    cartBar.classList.add('hidden');
    return;
  }
  const total = [...selectedMedia.values()].reduce((sum, m) => sum + m.price_cents, 0);
  cartSummary.textContent = `${count} selecionada(s) — R$ ${formatCents(total)}`;
  cartBar.classList.remove('hidden');
}

selfieForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const file = document.getElementById('selfie').files[0];
  if (!file) return;

  searchBtn.disabled = true;
  showMsg(searchMsg, 'Buscando...', false);
  resultsCard.classList.add('hidden');
  checkoutCard.classList.add('hidden');
  selectedMedia.clear();
  updateCartBar();
  try {
    // Upload direto do navegador pro R2: sem isso, selfies de celular passam
    // fácil do limite de ~4.5MB de corpo de requisição da Vercel pras nossas
    // serverless functions.
    const blob = await uploadToStorage(`selfies/${Date.now()}-${file.name}`, file, {
      handleUploadUrl: '/api/match/upload-url',
    });
    const data = await api('/api/match', { method: 'POST', body: { url: blob.url, content_type: blob.contentType } });
    showMsg(searchMsg, 'Busca concluída.', false);
    renderResults(data.results);
  } catch (err) {
    showMsg(searchMsg, err.message, true);
  } finally {
    searchBtn.disabled = false;
  }
});

function renderResults(results) {
  resultsCard.classList.remove('hidden');
  if (!results.length) {
    resultsEl.innerHTML = '<p>Nenhuma foto sua encontrada no catálogo ainda.</p>';
    return;
  }
  resultsEl.innerHTML = results.map(renderResultItem).join('');
  resultsEl.querySelectorAll('img.thumb').forEach((img) => {
    img.addEventListener('click', () => openLightbox(img.src, img.alt));
  });
  resultsEl.querySelectorAll('.cart-toggle').forEach((btn) => {
    btn.addEventListener('click', () => {
      const mediaId = Number(btn.dataset.mediaId);
      if (selectedMedia.has(mediaId)) {
        selectedMedia.delete(mediaId);
        setCartToggleState(btn, false);
      } else {
        selectedMedia.set(mediaId, {
          price_cents: Number(btn.dataset.priceCents),
          type: btn.dataset.type,
        });
        setCartToggleState(btn, true);
      }
      updateCartBar();
    });
  });
}

function setCartToggleState(btn, inCart) {
  btn.classList.toggle('in-cart', inCart);
  btn.textContent = inCart ? 'No carrinho ✓' : 'Adicionar ao carrinho';
}

function escapeAttr(text) {
  return String(text == null ? '' : text)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// Se a prévia não carregar (blob removido, rede etc.), troca por um
// placeholder e desabilita a seleção — o cliente não deve comprar uma foto
// que nem consegue ver.
window.markBroken = function (el) {
  const item = el.closest('.item');
  if (!item) return;
  item.classList.add('broken');
  const btn = item.querySelector('.cart-toggle');
  if (btn) {
    btn.disabled = true;
    btn.textContent = 'Indisponível';
    selectedMedia.delete(Number(btn.dataset.mediaId));
    updateCartBar();
  }
  const fallback = document.createElement('div');
  fallback.className = 'thumb-fallback';
  fallback.textContent = 'prévia indisponível';
  el.replaceWith(fallback);
};

// Amplia a prévia (já com marca d'água) num popup ao clicar na foto.
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox) lightbox.close(); // clique fora da imagem fecha
});
lightbox.querySelector('.lightbox-close').addEventListener('click', () => lightbox.close());

function openLightbox(url, alt) {
  lightboxImg.src = url;
  lightboxImg.alt = alt;
  lightbox.showModal();
}

function renderResultItem(r) {
  const alt = escapeAttr(r.event_name || 'foto');
  const src = escapeAttr(r.url);
  const media = r.type === 'video'
    ? `<video src="${src}" muted controls onerror="markBroken(this)"></video>`
    // "thumb": clicável, abre a mesma imagem (já com marca d'água) ampliada
    // no lightbox — ver openLightbox.
    : `<img class="thumb" src="${src}" alt="${alt}" onerror="markBroken(this)">`;
  return `<div class="item" data-media-id="${r.media_id}">
    ${media}
    <div class="info">
      <div>${escapeAttr(r.event_name) || '(sem evento)'}</div>
      <div class="price">R$ ${formatCents(r.price_cents)}</div>
      <button type="button" class="cart-toggle" data-media-id="${r.media_id}" data-price-cents="${r.price_cents}" data-type="${r.type}">Adicionar ao carrinho</button>
    </div>
  </div>`;
}

cartBuyBtn.addEventListener('click', () => {
  if (selectedMedia.size === 0) return;
  resultsCard.classList.add('hidden');
  cartBar.classList.add('hidden');
  renderCheckoutForm();
});

// Fluxo de compra em 3 passos: 1) nome+telefone -> 2) Pix copia-e-cola/QR do
// valor total + upload de comprovante -> 3) todas as mídias liberadas.
function renderCheckoutForm() {
  checkoutCard.classList.remove('hidden');
  const total = [...selectedMedia.values()].reduce((sum, m) => sum + m.price_cents, 0);
  checkoutBody.innerHTML = `
    <p>${selectedMedia.size} item(ns) selecionado(s) — total <strong>R$ ${formatCents(total)}</strong></p>
    <form class="buy-form">
      <label>Nome</label>
      <input type="text" class="buyer-name" required>
      <label>Telefone</label>
      <input type="tel" class="buyer-phone" placeholder="(11) 99999-9999" required>
      <label>CPF</label>
      <input type="text" class="buyer-cpf" inputmode="numeric" placeholder="000.000.000-00" maxlength="14" required>
      <button type="submit">Gerar Pix</button>
    </form>
    <p class="msg"></p>`;
  const form = checkoutBody.querySelector('.buy-form');
  const msg = checkoutBody.querySelector('.msg');
  const cpfInput = checkoutBody.querySelector('.buyer-cpf');
  cpfInput.addEventListener('input', () => { cpfInput.value = formatCpf(cpfInput.value); });
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const buyer_name = checkoutBody.querySelector('.buyer-name').value.trim();
    const buyer_phone = checkoutBody.querySelector('.buyer-phone').value.trim();
    const buyer_cpf = cpfInput.value.replace(/\D/g, '');
    const submitBtn = form.querySelector('button');
    submitBtn.disabled = true;
    showMsg(msg, 'Gerando Pix...', false);
    try {
      const order = await api('/api/orders', {
        method: 'POST',
        body: { media_ids: [...selectedMedia.keys()], buyer_name, buyer_phone, buyer_cpf },
      });
      renderPixStep(order);
    } catch (err) {
      showMsg(msg, err.message, true);
      submitBtn.disabled = false;
    }
  });
}

// container é opcional pra permitir reusar este passo fora do checkout
// principal (ex.: pedido pendente reaberto pela busca por CPF, Tarefa 4).
function renderPixStep(order, container = checkoutBody) {
  container.innerHTML = `
    <div class="pix-box">
      <p>Pague <strong>R$ ${formatCents(order.amount_cents)}</strong> com o Pix copia-e-cola abaixo (${order.items.length} item(ns)):</p>
      ${order.qr_code_data_url ? `<img class="pix-qr" src="${order.qr_code_data_url}" alt="QR code Pix">` : ''}
      <textarea class="pix-code" readonly rows="3">${order.pix_code}</textarea>
      <button type="button" class="copy-btn link">Copiar código</button>
      <label>Comprovante do Pix (imagem ou PDF)</label>
      <input type="file" class="proof-file" accept="image/jpeg,image/png,image/webp,application/pdf" required>
      <button type="button" class="confirm-btn">Já paguei, enviar comprovante</button>
      <p class="msg"></p>
    </div>`;
  container.querySelector('.copy-btn').addEventListener('click', () => {
    navigator.clipboard?.writeText(order.pix_code).catch(() => {});
  });
  const confirmBtn = container.querySelector('.confirm-btn');
  const msg = container.querySelector('.msg');
  confirmBtn.addEventListener('click', async () => {
    const file = container.querySelector('.proof-file').files[0];
    if (!file) {
      showMsg(msg, 'Selecione o arquivo do comprovante.', true);
      return;
    }
    confirmBtn.disabled = true;
    showMsg(msg, 'Enviando comprovante...', false);
    try {
      // Mesmo motivo dos outros uploads: direto pro R2, sem passar pelo
      // limite de corpo de requisição das serverless functions.
      const blob = await uploadToStorage(`proofs/${Date.now()}-${file.name}`, file, {
        handleUploadUrl: `/api/orders/${order.public_token}/proof/upload-url`,
      });
      const updated = await api(`/api/orders/${order.public_token}/proof`, {
        method: 'POST',
        body: { url: blob.url, content_type: blob.contentType },
      });
      renderPaidStep(updated, container);
    } catch (err) {
      showMsg(msg, err.message, true);
      confirmBtn.disabled = false;
    }
  });
}

// Um item comprado: link "Baixar" (existente) + botão "Visualizar" que abre
// a mesma imagem no lightbox já usado nos resultados da selfie, ou em nova
// aba pra vídeo (lightbox aqui só lida com <img>).
function renderPaidItemHtml(item, i) {
  const url = escapeAttr(item.download_url);
  const label = item.type === 'video' ? 'vídeo' : 'foto';
  return `<div class="top-row">
    <a class="download-link" href="${url}" download target="_blank" rel="noopener">Baixar item ${i + 1} (${label})</a>
    <button type="button" class="view-btn link" data-url="${url}" data-type="${escapeAttr(item.type)}">Visualizar</button>
  </div>`;
}

function wireViewButtons(container) {
  container.querySelectorAll('.view-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (btn.dataset.type === 'video') {
        window.open(btn.dataset.url, '_blank', 'noopener');
      } else {
        openLightbox(btn.dataset.url, 'Foto comprada');
      }
    });
  });
}

function renderPaidStep(order, container = checkoutBody) {
  container.innerHTML = `
    <p class="msg ok">Pagamento confirmado! ${order.items.length} item(ns) liberado(s).</p>
    ${order.items.map(renderPaidItemHtml).join('')}`;
  wireViewButtons(container);
}

// Tarefa 4: cliente reabre compras antigas só com o CPF, sem link/token.
const showCpfSearchBtn = document.getElementById('showCpfSearchBtn');
const cpfCard = document.getElementById('cpfCard');
const cpfSearchInput = document.getElementById('cpfSearchInput');
const cpfSearchBtn = document.getElementById('cpfSearchBtn');
const cpfSearchMsg = document.getElementById('cpfSearchMsg');
const cpfResults = document.getElementById('cpfResults');

cpfSearchInput.addEventListener('input', () => { cpfSearchInput.value = formatCpf(cpfSearchInput.value); });
showCpfSearchBtn.addEventListener('click', () => cpfCard.classList.toggle('hidden'));

const ORDER_STATUS_LABELS = { awaiting_payment: 'Aguardando pagamento', paid: 'Pago' };

cpfSearchBtn.addEventListener('click', async () => {
  const cpf = cpfSearchInput.value.replace(/\D/g, '');
  cpfSearchBtn.disabled = true;
  cpfResults.innerHTML = '';
  showMsg(cpfSearchMsg, 'Buscando...', false);
  try {
    const data = await api(`/api/orders/by-cpf/${cpf}`);
    if (!data.orders.length) {
      showMsg(cpfSearchMsg, 'Nenhuma compra encontrada com esse CPF.', false);
      return;
    }
    showMsg(cpfSearchMsg, `${data.orders.length} pedido(s) encontrado(s).`, false);
    data.orders.forEach((order) => {
      const box = document.createElement('div');
      box.className = 'card';
      const statusLabel = ORDER_STATUS_LABELS[order.status] || order.status;
      const header = document.createElement('p');
      header.innerHTML = `<strong>${escapeAttr(statusLabel)}</strong> — R$ ${formatCents(order.amount_cents)}`;
      box.appendChild(header);
      const body = document.createElement('div');
      box.appendChild(body);
      cpfResults.appendChild(box);
      if (order.status === 'paid') {
        renderPaidStep(order, body);
      } else {
        renderPixStep(order, body);
      }
    });
  } catch (err) {
    showMsg(cpfSearchMsg, err.message, true);
  } finally {
    cpfSearchBtn.disabled = false;
  }
});
</script>
</body>
</html>
