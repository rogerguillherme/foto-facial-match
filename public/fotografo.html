<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Área do fotógrafo — Foto Facial Match</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <a href="/">Foto Facial Match</a>
  <button id="logoutBtn" class="hidden" style="margin:0">Sair</button>
</header>
<main>

  <section id="authSection" class="card">
    <h1 id="authTitle">Entrar</h1>
    <form id="loginForm">
      <label for="loginEmail">E-mail</label>
      <input id="loginEmail" type="email" required>
      <label for="loginPassword">Senha</label>
      <input id="loginPassword" type="password" required>
      <button type="submit">Entrar</button>
    </form>
    <form id="registerForm" class="hidden">
      <label for="regName">Nome</label>
      <input id="regName" required>
      <label for="regEmail">E-mail</label>
      <input id="regEmail" type="email" required>
      <label for="regPassword">Senha (mín. 8 caracteres)</label>
      <input id="regPassword" type="password" minlength="8" required>
      <button type="submit">Criar conta</button>
    </form>
    <button type="button" class="link" id="toggleAuth">Não tenho conta — cadastrar</button>
    <p id="authMsg" class="msg"></p>
  </section>

  <section id="appSection" class="hidden">
    <div class="card">
      <h2>Chave Pix (recebimento)</h2>
      <form id="pixForm">
        <label for="pixKey">Sua chave Pix</label>
        <input id="pixKey" placeholder="e-mail, telefone, CPF/CNPJ ou chave aleatória">
        <button type="submit">Salvar chave Pix</button>
      </form>
      <p id="pixMsg" class="msg"></p>
    </div>

    <div class="card">
      <h2>Preço fixo por tipo de mídia</h2>
      <form id="pricingForm">
        <label for="pricePhoto">Preço de cada foto (R$)</label>
        <input id="pricePhoto" type="number" step="0.01" min="0" required>
        <label for="priceVideo">Preço de cada vídeo (R$)</label>
        <input id="priceVideo" type="number" step="0.01" min="0" required>
        <button type="submit">Salvar preços</button>
      </form>
      <p id="pricingMsg" class="msg"></p>
    </div>

    <div class="card">
      <h2>Enviar fotos ou vídeos</h2>
      <form id="uploadForm">
        <label for="file">Arquivos (JPEG, PNG, WEBP, MP4, MOV) — pode selecionar vários de uma vez</label>
        <input id="file" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime" multiple required>
        <label for="eventName">Nome do evento</label>
        <input id="eventName" placeholder="ex.: Casamento Ana & Léo">
        <button type="submit" id="uploadBtn">Enviar</button>
      </form>
      <ul id="uploadList"></ul>
      <p id="uploadMsg" class="msg"></p>
    </div>

    <div class="card">
      <div class="top-row"><h2>Meu catálogo</h2><button type="button" id="refreshBtn">Atualizar</button></div>
      <div id="catalog" class="grid"></div>
    </div>
  </section>

</main>
<script src="/api.js"></script>
<script>
const authSection = document.getElementById('authSection');
const appSection = document.getElementById('appSection');
const logoutBtn = document.getElementById('logoutBtn');
const authMsg = document.getElementById('authMsg');
const loginForm = document.getElementById('loginForm');
const registerForm = document.getElementById('registerForm');
const toggleAuth = document.getElementById('toggleAuth');
const authTitle = document.getElementById('authTitle');

function showMsg(el, text, isError) {
  el.textContent = text;
  el.className = 'msg ' + (isError ? 'error' : 'ok');
}

function refreshAuthUI() {
  const logged = !!getToken();
  authSection.classList.toggle('hidden', logged);
  appSection.classList.toggle('hidden', !logged);
  logoutBtn.classList.toggle('hidden', !logged);
  if (logged) {
    loadCatalog();
    loadPixKey();
  }
}

const pixForm = document.getElementById('pixForm');
const pixMsg = document.getElementById('pixMsg');
const pixKeyInput = document.getElementById('pixKey');
const pricingForm = document.getElementById('pricingForm');
const pricingMsg = document.getElementById('pricingMsg');
const pricePhotoInput = document.getElementById('pricePhoto');
const priceVideoInput = document.getElementById('priceVideo');

async function loadPixKey() {
  try {
    const me = await api('/api/auth/me', { auth: true });
    pixKeyInput.value = me.pix_key || '';
    pricePhotoInput.value = (me.price_photo_cents / 100).toFixed(2);
    priceVideoInput.value = (me.price_video_cents / 100).toFixed(2);
  } catch (err) {
    showMsg(pixMsg, err.message, true);
  }
}

pixForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await api('/api/auth/pix-key', { method: 'PUT', body: { pix_key: pixKeyInput.value.trim() }, auth: true });
    showMsg(pixMsg, 'Chave Pix salva!', false);
  } catch (err) {
    showMsg(pixMsg, err.message, true);
  }
});

pricingForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await api('/api/auth/pricing', {
      method: 'PUT',
      body: {
        price_photo_cents: Math.round(Number(pricePhotoInput.value) * 100),
        price_video_cents: Math.round(Number(priceVideoInput.value) * 100),
      },
      auth: true,
    });
    showMsg(pricingMsg, 'Preços salvos!', false);
  } catch (err) {
    showMsg(pricingMsg, err.message, true);
  }
});

toggleAuth.addEventListener('click', () => {
  const showingLogin = !loginForm.classList.contains('hidden');
  loginForm.classList.toggle('hidden', showingLogin);
  registerForm.classList.toggle('hidden', !showingLogin);
  authTitle.textContent = showingLogin ? 'Criar conta' : 'Entrar';
  toggleAuth.textContent = showingLogin ? 'Já tenho conta — entrar' : 'Não tenho conta — cadastrar';
  authMsg.textContent = '';
});

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  try {
    const data = await api('/api/auth/login', { method: 'POST', body: { email, password } });
    setToken(data.token);
    refreshAuthUI();
  } catch (err) {
    showMsg(authMsg, err.message, true);
  }
});

registerForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('regName').value;
  const email = document.getElementById('regEmail').value;
  const password = document.getElementById('regPassword').value;
  try {
    const data = await api('/api/auth/register', { method: 'POST', body: { name, email, password } });
    setToken(data.token);
    refreshAuthUI();
  } catch (err) {
    showMsg(authMsg, err.message, true);
  }
});

logoutBtn.addEventListener('click', () => {
  setToken(null);
  refreshAuthUI();
});

const uploadForm = document.getElementById('uploadForm');
const uploadMsg = document.getElementById('uploadMsg');
const uploadBtn = document.getElementById('uploadBtn');

const uploadList = document.getElementById('uploadList');

// Envia um arquivo por vez pro fluxo já existente (upload-url -> Blob ->
// confirmação em /api/media), atualizando a linha de status dele na lista.
// Nenhum endpoint novo: é só o mesmo fluxo de upload de sempre, chamado uma
// vez por arquivo selecionado.
async function uploadOneFile(file, eventName, statusEl) {
  statusEl.textContent = `${file.name}: enviando...`;
  try {
    // Upload direto do navegador pro Vercel Blob: o arquivo não passa pelo
    // corpo da nossa function (limite de ~4.5MB da Vercel), só a confirmação
    // final com a URL do Blob passa por /api/media. `uploadPresigned` (não
    // `upload`) porque o Blob store deste projeto usa credenciais OIDC, sem
    // token estático — ver comentário em src/services/storage.js.
    const { uploadPresigned } = await import('https://esm.sh/@vercel/blob/client');
    const category = file.type.startsWith('video/') ? 'videos' : 'photos';
    const blob = await uploadPresigned(`${category}/${Date.now()}-${file.name}`, file, {
      access: 'public', // exigido pelo SDK como checagem client-side; o store já é público
      handleUploadUrl: '/api/media/upload-url',
      headers: { Authorization: 'Bearer ' + getToken() },
    });
    await api('/api/media', {
      method: 'POST',
      body: { url: blob.url, content_type: file.type, original_name: file.name, event_name: eventName },
      auth: true,
    });
    statusEl.textContent = `${file.name}: ok`;
    statusEl.className = 'ok';
    return true;
  } catch (err) {
    statusEl.textContent = `${file.name}: erro — ${err.message}`;
    statusEl.className = 'error';
    return false;
  }
}

uploadForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const files = Array.from(document.getElementById('file').files);
  const eventName = document.getElementById('eventName').value;
  if (!files.length) return;

  uploadBtn.disabled = true;
  uploadList.innerHTML = '';
  showMsg(uploadMsg, `Enviando ${files.length} arquivo(s)...`, false);

  // Um upload por vez (não é preciso paralelismo pra isso, e evita saturar
  // a conexão do fotógrafo com N uploads simultâneos de foto de celular).
  let okCount = 0;
  for (const file of files) {
    const li = document.createElement('li');
    uploadList.appendChild(li);
    const ok = await uploadOneFile(file, eventName, li);
    if (ok) okCount++;
  }

  showMsg(uploadMsg, `${okCount} de ${files.length} arquivo(s) enviados com sucesso.`, okCount < files.length);
  uploadForm.reset();
  uploadBtn.disabled = false;
  loadCatalog();
});

document.getElementById('refreshBtn').addEventListener('click', loadCatalog);

async function loadCatalog() {
  const catalog = document.getElementById('catalog');
  catalog.textContent = 'Carregando...';
  try {
    const items = await api('/api/media', { auth: true });
    if (!items.length) {
      catalog.innerHTML = '<p>Nenhuma mídia enviada ainda.</p>';
      return;
    }
    catalog.innerHTML = items.map(renderCatalogItem).join('');
  } catch (err) {
    catalog.innerHTML = '<p class="msg error">' + err.message + '</p>';
  }
}

function renderCatalogItem(item) {
  const media = item.type === 'video'
    ? `<video src="${item.url}" muted></video>`
    : `<img src="${item.url}" alt="${item.event_name || 'mídia'}">`;
  return `<div class="item">
    ${media}
    <div class="info">
      <div>${item.event_name || '(sem evento)'}</div>
      <div class="price">R$ ${(item.price_cents / 100).toFixed(2)}</div>
      <div class="status">status rosto: ${item.face_status}</div>
    </div>
  </div>`;
}

refreshAuthUI();
</script>
</body>
</html>
